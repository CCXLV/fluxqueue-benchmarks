services:
  redis:
    image: redis:8.4.0
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - fluxq_redis_data:/data

  postgres:
    image: postgres:17.7
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - fluxq_postgres_data:/var/lib/postgresql/data

volumes:
  fluxq_postgres_data:
  fluxq_redis_data:
